# Telegraf: MQTT (local Mosquitto) -> InfluxDB v2 (local).
#
# Values come from environment variables set in docker-compose.yml / .env.
#
# WHY THIS FILE MATTERS
# The gateway publishes every sensor reading as a JSON *string*, e.g.
#   {"bVoltage": "52.4", "bSOC": "91.0", "cImu": "{\"pitch\":1.2,...}", ...}
# Telegraf's json parser silently DROPS string values unless they are listed
# in `json_string_fields`. Without that, only the genuinely numeric
# `timestamp` reached InfluxDB and Analytics had nothing to chart.
# So: (1) keep the string fields in the parser, then
#     (2) convert the numeric ones to floats with the converter processor.

[agent]
  interval = "1s"
  flush_interval = "1s"

[[inputs.mqtt_consumer]]
  servers = ["tls://${MQTT_HOST}:8883"]
  topics = ["tukzie/telemetry"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  tls_ca = "/etc/telegraf/ca.crt"
  # Server cert is CN=localhost but we connect by Docker service name;
  # the CA is still verified, only the hostname check is skipped.
  insecure_skip_verify = true
  client_id = "telegraf-local"

  data_format = "json"
  name_override = "telemetry"
  # Keep the string-typed sensor fields (otherwise they are discarded).
  json_string_fields = [
    "fRadar", "bRadar", "brake", "light", "throttle", "rain",
    "bVoltage", "bTemp", "bCurrent", "bSOC", "bFault", "sequence",
    "lever", "cImu", "rImu", "schema_version"
  ]

# Turn numeric strings into real numbers so they can be charted.
# (lever, cImu, rImu, schema_version stay as text.)
[[processors.converter]]
  [processors.converter.fields]
    float = [
      "fRadar", "bRadar", "brake", "light", "throttle", "rain",
      "bVoltage", "bTemp", "bCurrent", "bSOC", "bFault", "sequence"
    ]

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
