# ACL for the local_docker Mosquitto broker (Version 1 — laptop only).
#
# Version 1 shortcut: everything (the sensor simulator, the command
# validator/mock rig, and the dashboard) runs as ONE dev user with full
# access, because this broker only ever runs on your own laptop right
# now -- there's no one else to isolate from.
#
# TODO before this broker runs anywhere shared (Pi on a shared network,
# or eventually production): split this back into role-scoped users,
# mirroring the pattern already used on the real Hostinger broker
# (esp32_publisher = publish-only, dashboard_reader = subscribe-only,
# etc. -- see Cyber Security README section 2.2). A sketch of that
# split is left commented out below.

user dev_publisher
topic readwrite tukzie/#

# --- role-scoped version (re-enable once this leaves your laptop) ---
# user dev_publisher
# topic write tukzie/telemetry
#
# user dev_command_publisher
# topic write tukzie/commands
# topic read tukzie/acks
#
# user dev_dashboard_reader
# topic read tukzie/telemetry
# topic read tukzie/telemetry/rejected
# topic read tukzie/acks
#
# user dev_rig
# topic read tukzie/commands
# topic write tukzie/acks
