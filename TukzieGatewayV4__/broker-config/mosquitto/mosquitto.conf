# local_docker Mosquitto config — TLS + password auth (Task 15, Day 5)
#
# Run: docker run -it -p 8883:8883 \
#   -v $(pwd)/broker-config/mosquitto:/mosquitto/config \
#   eclipse-mosquitto

listener 8883
protocol mqtt

cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Generate passwd file with:
#   mosquitto_passwd -c broker-config/mosquitto/passwd dev_publisher
#   mosquitto_passwd broker-config/mosquitto/passwd dev_command_publisher
#   mosquitto_passwd broker-config/mosquitto/passwd dev_dashboard_reader
